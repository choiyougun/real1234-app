<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학교 우산 대여 및 반납 관리 (실시간 크로스 디바이스 Sync)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome 아이콘 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Pretendard', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 pb-12">

    <!-- 커스텀 알림 모달 -->
    <div id="customModal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-2xl p-6 max-w-sm w-full mx-4 shadow-xl transform scale-95 transition-transform duration-300">
            <div id="modalIcon" class="text-3xl mb-3 text-amber-500">
                <i class="fa-solid fa-circle-exclamation"></i>
            </div>
            <h3 id="modalTitle" class="text-lg font-bold text-slate-900 mb-1">알림</h3>
            <p id="modalMessage" class="text-slate-600 text-sm mb-5">메시지 내용</p>
            <div class="flex justify-end gap-2" id="modalButtons">
                <button onclick="closeModal()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-medium transition-colors w-full">확인</button>
            </div>
        </div>
    </div>

    <!-- 헤더 -->
    <header class="bg-gradient-to-r from-indigo-600 to-blue-600 text-white py-6 px-4 shadow-md sticky top-0 z-30">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-white/10 p-2.5 rounded-xl backdrop-blur-sm">
                    <i class="fa-solid fa-umbrella text-2xl text-yellow-300"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold">학교 우산 대여소 (1~5번)</h1>
                    <p class="text-xs text-indigo-100 flex items-center gap-1.5 mt-0.5">
                        <span id="syncDot" class="w-2 h-2 rounded-full bg-emerald-400 inline-block animate-pulse"></span>
                        <span id="syncText">실시간 동기화 연결됨</span>
                    </p>
                </div>
            </div>
            <div class="text-right">
                <span id="availableCountBadge" class="bg-white/20 text-xs font-semibold px-2.5 py-1 rounded-full">사용 가능 -/5</span>
            </div>
        </div>
    </header>

    <!-- 메인 컨테이너 -->
    <main class="max-w-md mx-auto px-4 mt-6">
        
        <!-- 대여 등록 카드 -->
        <section class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100 mb-6">
            <h2 class="text-base font-bold text-slate-900 mb-3 flex items-center gap-2">
                <i class="fa-solid fa-user-plus text-indigo-600"></i> 우산 대여 등록
            </h2>
            <form id="rentalForm" onsubmit="handleFormSubmit(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">대여할 우산 선택</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-400">
                            <i class="fa-solid fa-hashtag"></i>
                        </span>
                        <select id="umbrellaSelect" required
                            class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all appearance-none">
                            <option value="" disabled selected>우산을 선택하세요</option>
                            <option value="1">1번 우산</option>
                            <option value="2">2번 우산</option>
                            <option value="3">3번 우산</option>
                            <option value="4">4번 우산</option>
                            <option value="5">5번 우산</option>
                        </select>
                        <span class="absolute inset-y-0 right-0 flex items-center pr-3.5 pointer-events-none text-slate-400">
                            <i class="fa-solid fa-chevron-down text-xs"></i>
                        </span>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">학생 이름 및 학번</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-400">
                            <i class="fa-solid fa-id-card"></i>
                        </span>
                        <input type="text" id="studentName" placeholder="예: 20315 김철수" required
                            class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all">
                    </div>
                </div>
                <button type="submit" id="submitBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-4 rounded-xl shadow-lg shadow-indigo-100 transition-all flex items-center justify-center gap-2 text-sm mt-2">
                    <i class="fa-solid fa-check"></i> 대여하기
                </button>
            </form>
        </section>

        <!-- 5개 우산 대시보드 현황 -->
        <div class="flex items-center justify-between mb-3">
            <h2 class="text-base font-bold text-slate-900 flex items-center gap-2">
                <i class="fa-solid fa-gauge-high text-indigo-600"></i> 1~5번 우산 대시보드
            </h2>
            <span class="text-xs text-slate-500">실시간 크로스 동기화</span>
        </div>

        <!-- 5개 우산 현황 그리드/리스트 -->
        <div id="umbrellaDashboard" class="space-y-3">
            <div class="bg-white rounded-2xl p-6 text-center text-slate-400 border border-slate-100">
                <i class="fa-solid fa-spinner fa-spin text-2xl mb-2 text-indigo-500"></i>
                <p class="text-sm">실시간 클라우드 동기화 중...</p>
            </div>
        </div>

    </main>

    <!-- 스크립트 로직 -->
    <script>
        const BIN_ID = "671cc2eead19ca34f8be91bc"; 
        const API_KEY = "$2a$10$7R3T2m1Gf5L3/Y9r3k5cOe1pGvYQ6.KxL5vL6z5q5V9m7z.7G0d2a";
        const READ_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}/latest`;
        const WRITE_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

        let currentRentals = {};
        let isSyncing = false;

        document.addEventListener("DOMContentLoaded", () => {
            const localBackup = localStorage.getItem("umbrella_cloud_backup_v4");
            if (localBackup) {
                try {
                    currentRentals = JSON.parse(localBackup);
                    renderDashboard();
                } catch(e) {}
            }

            fetchCloudData();

            setInterval(() => {
                if (!isSyncing) fetchCloudData();
            }, 2000);
        });

        async function fetchCloudData() {
            try {
                const res = await fetch(READ_URL, {
                    method: "GET",
                    headers: {
                        "X-Master-Key": API_KEY,
                        "X-Bin-Meta": "false"
                    },
                    cache: "no-store"
                });

                if (res.ok) {
                    const data = await res.json();
                    if (data && data.rentals) {
                        currentRentals = data.rentals;
                        localStorage.setItem("umbrella_cloud_backup_v4", JSON.stringify(currentRentals));
                        renderDashboard();
                        updateSyncBadge(true);
                    }
                }
            } catch (e) {
                console.warn("동기화 대기 중...", e);
            }
        }

        async function saveCloudData() {
            isSyncing = true;
            localStorage.setItem("umbrella_cloud_backup_v4", JSON.stringify(currentRentals));
            renderDashboard();

            try {
                await fetch(WRITE_URL, {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json",
                        "X-Master-Key": API_KEY
                    },
                    body: JSON.stringify({ rentals: currentRentals })
                });
                updateSyncBadge(true);
            } catch (e) {
                console.error("클라우드 전송 지연:", e);
                updateSyncBadge(false);
            } finally {
                isSyncing = false;
            }
        }

        function updateSyncBadge(isOnline) {
            const dot = document.getElementById("syncDot");
            const text = document.getElementById("syncText");
            if (isOnline) {
                dot.className = "w-2 h-2 rounded-full bg-emerald-400 inline-block animate-pulse";
                text.innerText = "실시간 동기화 연결됨";
            } else {
                dot.className = "w-2 h-2 rounded-full bg-amber-400 inline-block";
                text.innerText = "오프라인 백업 모드";
            }
        }

        function showModal(title, message, isConfirm = false, onConfirm = null) {
            const modal = document.getElementById("customModal");
            const modalTitle = document.getElementById("modalTitle");
            const modalMessage = document.getElementById("modalMessage");
            const modalButtons = document.getElementById("modalButtons");
            const modalIcon = document.getElementById("modalIcon");

            modalTitle.innerText = title;
            modalMessage.innerText = message;
            
            if (isConfirm) {
                modalIcon.className = "text-3xl mb-3 text-indigo-600";
                modalIcon.innerHTML = '<i class="fa-solid fa-circle-question"></i>';
                modalButtons.innerHTML = `
                    <button onclick="closeModal()" class="flex-1 px-4 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-sm font-medium transition-colors">취소</button>
                    <button id="confirmBtn" class="flex-1 px-4 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-medium transition-colors">확인</button>
                `;
                document.getElementById("confirmBtn").onclick = () => {
                    onConfirm();
                    closeModal();
                };
            } else {
                modalIcon.className = "text-3xl mb-3 text-amber-500";
                modalIcon.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i>';
                modalButtons.innerHTML = `
                    <button onclick="closeModal()" class="px-4 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-medium transition-colors w-full">확인</button>
                `;
            }

            modal.classList.remove("hidden");
            setTimeout(() => {
                modal.classList.remove("opacity-0");
                modal.querySelector("div > div").classList.remove("scale-95");
            }, 10);
        }

        function closeModal() {
            const modal = document.getElementById("customModal");
            modal.classList.add("opacity-0");
            modal.querySelector("div > div").classList.add("scale-95");
            setTimeout(() => {
                modal.classList.add("hidden");
            }, 300);
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            const selectEl = document.getElementById("umbrellaSelect");
            const nameInput = document.getElementById("studentName");
            
            const umbrellaNo = selectEl.value;
            const name = nameInput.value.trim();

            if (!umbrellaNo || !name) return;

            if (currentRentals[umbrellaNo]) {
                showModal("대여 불가", `${umbrellaNo}번 우산은 이미 다른 학생(${currentRentals[umbrellaNo].name})이 대여 중입니다.`);
                return;
            }

            currentRentals[umbrellaNo] = {
                name: name,
                date: new Date().toLocaleDateString("ko-KR", { month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' })
            };

            selectEl.value = "";
            nameInput.value = "";

            saveCloudData();
        }

        function confirmReturn(num) {
            const item = currentRentals[num];
            if (!item) return;

            showModal("우산 반납", `${num}번 우산(${item.name} 학생 대여)을 반납 처리하시겠습니까?`, true, () => {
                delete currentRentals[num];
                saveCloudData();
            });
        }

        function renderDashboard() {
            const container = document.getElementById("umbrellaDashboard");
            const badge = document.getElementById("availableCountBadge");
            
            let availableCount = 0;
            for (let i = 1; i <= 5; i++) {
                if (!currentRentals[i]) availableCount++;
            }
            badge.innerText = `사용 가능 ${availableCount}/5`;

            let html = "";
            for (let i = 1; i <= 5; i++) {
                const item = currentRentals[i];
                const isRented = !!item;

                if (isRented) {
                    html += `
                        <div class="bg-amber-50/70 rounded-2xl p-4 shadow-sm border border-amber-200 flex items-center justify-between transition-all">
                            <div class="flex items-center space-x-3.5">
                                <div class="w-10 h-10 rounded-xl bg-amber-500 text-white flex items-center justify-center font-bold text-sm shrink-0 shadow-sm shadow-amber-200">
                                    ${i}번
                                </div>
                                <div>
                                    <div class="flex items-center gap-2">
                                        <h3 class="font-bold text-slate-900 text-sm">${escapeHtml(item.name)}</h3>
                                        <span class="bg-amber-200 text-amber-800 text-[10px] px-2 py-0.5 rounded-md font-bold">대여 중</span>
                                    </div>
                                    <p class="text-xs text-slate-500 mt-0.5"><i class="fa-regular fa-clock mr-1"></i>${item.date} 대여</p>
                                </div>
                            </div>
                            <button onclick="confirmReturn(${i})" 
                                class="bg-white hover:bg-slate-100 text-slate-700 border border-slate-200 px-3.5 py-2 rounded-xl text-xs font-semibold transition-all flex items-center gap-1.5 shrink-0 shadow-sm">
                                <i class="fa-solid fa-rotate-left text-indigo-600"></i> 반납
                            </button>
                        </div>
                    `;
                } else {
                    html += `
                        <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 flex items-center justify-between transition-all hover:border-indigo-200">
                            <div class="flex items-center space-x-3.5">
                                <div class="w-10 h-10 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center font-bold text-sm shrink-0">
                                    ${i}번
                                </div>
                                <div>
                                    <h3 class="font-bold text-slate-800 text-sm">우산 #${i}</h3>
                                    <p class="text-xs text-emerald-600 font-medium mt-0.5"><i class="fa-solid fa-circle-check mr-1"></i>사용 가능</p>
                                </div>
                            </div>
                            <button onclick="selectUmbrella(${i})" 
                                class="bg-indigo-50 hover:bg-indigo-600 text-indigo-600 hover:text-white px-3.5 py-2 rounded-xl text-xs font-semibold transition-all flex items-center gap-1.5 shrink-0">
                                <i class="fa-solid fa-umbrella"></i> 선택
                            </button>
                        </div>
                    `;
                }
            }
            container.innerHTML = html;
        }

        function selectUmbrella(num) {
            const selectEl = document.getElementById("umbrellaSelect");
            selectEl.value = num;
            document.getElementById("studentName").focus();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function escapeHtml(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }
    </script>
</body>
</html>
